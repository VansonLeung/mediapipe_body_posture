appId: com.forma.pose
productName: Forma
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'
asar: true
npmRebuild: false
mac:
  identity: '-'
  target: dmg
  category: public.app-category.healthcare-fitness
  extendInfo:
    NSCameraUsageDescription: Forma uses your camera for local movement and posture analysis.
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
win:
  target: nsis
linux:
  target: AppImage
  category: Utility
